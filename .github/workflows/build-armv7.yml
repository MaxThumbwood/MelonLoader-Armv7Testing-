name: Build LemonLoader ARMv7

on:
  workflow_dispatch:

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NDK directly
        run: |
          NDK_VERSION="r26d"
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          echo "NDK_HOME=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Install Rust stable + ARMv7 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Bootstrap (ARMv7)
        run: |
          cargo ndk \
            -t armeabi-v7a \
            --manifest-path Rust/Bootstrap/Cargo.toml \
            -o ./output/jniLibs \
            build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build MelonProxy (ARMv7)
        run: |
          cargo ndk \
            -t armeabi-v7a \
            --manifest-path Rust/MelonProxy/Cargo.toml \
            -o ./output/jniLibs \
            build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build C# MelonLoader core
        run: |
          dotnet build MelonLoader/MelonLoader.csproj \
            -c Release \
            -o ./output/net

      - name: Build NativeHost
        run: |
          dotnet build MelonLoader.NativeHost/MelonLoader.NativeHost.csproj \
            -c Release \
            -o ./output/net

      - name: Build Support Modules
        run: |
          dotnet build Dependencies/SupportModules/Il2Cpp/Il2Cpp.csproj \
            -c Release -o ./output/net
          dotnet build Dependencies/SupportModules/Preload/Preload.csproj \
            -c Release -o ./output/net

      - name: Upload ARMv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LemonLoader-armv7
          path: ./output/
          retention-days: 7
