name: Build LemonLoader ARMv7

on:
  workflow_dispatch:  # manual trigger from GitHub Actions tab

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java (for Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install NDK r26
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Bootstrap (ARMv7)
        run: |
          cargo ndk \
            -t armeabi-v7a \
            --manifest-path Rust/Bootstrap/Cargo.toml \
            -o ./output/jniLibs \
            build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build MelonProxy (ARMv7)
        run: |
          cargo ndk \
            -t armeabi-v7a \
            --manifest-path Rust/MelonProxy/Cargo.toml \
            -o ./output/jniLibs \
            build --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build C# MelonLoader core
        run: |
          dotnet build MelonLoader/MelonLoader.csproj \
            -c Release \
            -o ./output/net \
            /p:TargetFramework=net8.0

      - name: Build NativeHost
        run: |
          dotnet build MelonLoader.NativeHost/MelonLoader.NativeHost.csproj \
            -c Release \
            -o ./output/net

      - name: Build Support Modules
        run: |
          dotnet build Dependencies/SupportModules/Il2Cpp/Il2Cpp.csproj \
            -c Release -o ./output/net
          dotnet build Dependencies/SupportModules/Preload/Preload.csproj \
            -c Release -o ./output/net

      - name: Upload ARMv7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LemonLoader-armv7
          path: ./output/
          retention-days: 7
